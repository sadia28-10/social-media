<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Circle</title>
  <meta name="description" content="Circle — a small, friendly place to share posts and follow people.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>// Runs before the page paints so the saved theme is applied without a flash. Kept as a tiny classic script.
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();</script>
</head>
<body>
  <div class="static-page">
    <h1>404</h1>
    <h2>This page does not exist</h2>
    <p class="muted">The link may be broken, or the page may have moved.</p>
    <a class="btn btn-primary" href="index.html">Back to home</a>
  </div>
</body>
</html>

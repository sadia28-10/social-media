<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign up · Circle</title>
  <meta name="description" content="Circle — a small, friendly place to share posts and follow people.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>// Runs before the page paints so the saved theme is applied without a flash. Kept as a tiny classic script.
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();</script>
</head>
<body class="auth-page">
  <button class="icon-btn auth-theme-toggle" type="button" id="theme-toggle" aria-label="Toggle dark mode"></button>
  <div class="card auth-card">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg></span>
      Circle
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p id="form-error" class="form-error" role="alert"></p>
    <form id="register-form" novalidate>
      <div class="field">
        <label for="displayName">Display name</label>
        <input class="input" id="displayName" name="displayName" autocomplete="name" maxlength="50" placeholder="Your name" required>
        <p class="field-error" id="displayName-error" data-error-for="displayName" role="alert"></p>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" maxlength="30" placeholder="lowercase_letters_numbers" required>
        <p class="field-error" id="username-error" data-error-for="username" role="alert"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" id="email-error" data-error-for="email" role="alert"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
        <p class="field-error" id="password-error" data-error-for="password" role="alert"></p>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
  <script type="module">
    import './js/theme.js';
    import { toggleTheme, getTheme } from './js/theme.js';
    import { icon } from './js/icons.js';
    const btn = document.getElementById('theme-toggle');
    const render = () => { btn.replaceChildren(icon(getTheme() === 'dark' ? 'sun' : 'moon')); };
    btn.addEventListener('click', toggleTheme);
    document.addEventListener('themechange', render);
    render();
  </script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>

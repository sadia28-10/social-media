<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · Circle</title>
  <meta name="description" content="Circle — a small, friendly place to share posts and follow people.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>// Runs before the page paints so the saved theme is applied without a flash. Kept as a tiny classic script.
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();</script>
</head>
<body class="auth-page">
  <button class="icon-btn auth-theme-toggle" type="button" id="theme-toggle" aria-label="Toggle dark mode"></button>
  <div class="card auth-card">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg></span>
      Circle
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p id="form-error" class="form-error" role="alert"></p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="identifier">Email or username</label>
        <input class="input" id="identifier" name="identifier" autocomplete="username" required>
        <p class="field-error" id="identifier-error" data-error-for="identifier" role="alert"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" id="password-error" data-error-for="password" role="alert"></p>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
  </div>
  <script type="module">
    import './js/theme.js';
    import { toggleTheme, getTheme } from './js/theme.js';
    import { icon } from './js/icons.js';
    const btn = document.getElementById('theme-toggle');
    const render = () => { btn.replaceChildren(icon(getTheme() === 'dark' ? 'sun' : 'moon')); };
    btn.addEventListener('click', toggleTheme);
    document.addEventListener('themechange', render);
    render();
  </script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
